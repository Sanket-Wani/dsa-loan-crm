services:
  db:
    image: postgres:16-alpine
    container_name: dsa-loan-crm-db
    environment:
      POSTGRES_USER: dsa
      POSTGRES_PASSWORD: dsa_dev_password
      POSTGRES_DB: dsa_loan_crm
    ports: ["5432:5432"]
    volumes: [dsa_pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dsa -d dsa_loan_crm"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  dsa_pgdata:
